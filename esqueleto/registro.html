<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartaviva · Registro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D3557">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DDE4EC}
a{color:#0077B6}a:hover{color:#005A8C}
</style>
<div style="width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; box-sizing: border-box; background: #F8F9FA; color: #1D3557; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 24px 20px">

  <div style="display: flex; align-items: center; gap: 8px">
    <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: #0077B6; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
    </div>
    <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Cartaviva</span>
  </div>

  <h1 style="margin: 24px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Crea tu cuenta</h1>
  <p style="margin: 0 0 16px; font-size: 14px; color: #4A5B70">Solo pedimos los datos que la app necesita.</p>

  <form style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Subir foto de perfil" style="width: 64px; height: 64px; flex: none; border-radius: 32px; border: 2px dashed #9FB0C2; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <span style="font-size: 13px; color: #4A5B70">Foto de perfil: es lo único que verá el anfitrión, junto con tu alias.</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Alias
      <input type="text" placeholder="Cómo te verán en los eventos" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D4DF; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 15px; color: #1D3557">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Correo
      <input type="email" placeholder="nombre@correo.com" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D4DF; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 15px; color: #1D3557">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Contraseña
        <input type="password" placeholder="Mínimo 8" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D4DF; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 15px; color: #1D3557; min-width: 0">
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Nacimiento
        <input type="text" placeholder="DD/MM/AAAA" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D4DF; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 15px; color: #1D3557; min-width: 0">
      </label>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 600">Quiero usar Cartaviva como</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid #0077B6; background: #E3F1F9; font-size: 14px; font-weight: 600"><input type="radio" name="rol" checked style="accent-color: #0077B6">Asistente</label>
        <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D4DF; background: #FFFFFF; font-size: 14px; font-weight: 600"><input type="radio" name="rol" style="accent-color: #0077B6">Anfitrión</label>
      </div>
    </fieldset>

    <label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9D4DF; font-size: 12.5px; line-height: 1.45; color: #1D3557">
      <input type="checkbox" style="width: 20px; height: 20px; flex: none; margin: 0; accent-color: #0077B6">
      <span>Autorizo el tratamiento de mis datos personales según la Ley 1581 de 2012 y la <a href="#politica" style="font-weight: 700">política de privacidad</a>. No pedimos cédula ni teléfono.</span>
    </label>

    <a href="explorar.html" style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 4px; border-radius: 12px; background: #0077B6; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,119,182,0.25)">Crear cuenta</a>
  </form>

  <p style="margin: 16px 0 0; text-align: center; font-size: 14px; color: #4A5B70">¿Ya tienes cuenta? <a href="explorar.html" style="font-weight: 700">Inicia sesión</a></p>
</div>
</body>
</html>
