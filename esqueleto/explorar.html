<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartaviva · Explorar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D3557">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DDE4EC}
a{color:#0077B6}a:hover{color:#005A8C}
</style>
<div style="width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; box-sizing: border-box; background: #F8F9FA; color: #1D3557; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: #0077B6; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </div>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Cartaviva</span>
    </div>
    <button aria-label="Mi perfil" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #DDE6EE; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D3557" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
    </button>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,53,87,0.08), 0 4px 12px rgba(29,53,87,0.06)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5B70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar eventos</span>
      <input type="search" placeholder="Buscar eventos en Cartagena" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 15px; color: #1D3557; background: transparent">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #1D3557; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">Hoy</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C9D4DF; background: #FFFFFF; color: #1D3557; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">Categoría</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C9D4DF; background: #FFFFFF; color: #1D3557; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">A 2 km</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #F77F00; color: #1D3557; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap">Relámpago</button>
    </div>
  </div>

  <section aria-label="Mapa de eventos" style="margin: 12px 16px 0; height: 300px; border-radius: 12px; background: #CFE3EE; position: relative; overflow: hidden">
    <svg width="100%" height="100%" viewBox="0 0 358 300" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0">
      <path d="M0 210 C70 190 110 240 170 220 S280 150 358 175 L358 300 L0 300 Z" fill="#A9CCE0"></path>
      <path d="M30 0 L60 300 M0 90 L358 120 M150 0 L210 300 M0 40 L358 60 M260 0 L300 300" stroke="#E7F0F5" stroke-width="6" fill="none"></path>
    </svg>
    <div style="position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.92); font-size: 11.5px; font-weight: 600; color: #1D3557">[Mapa de Cartagena · API de mapas]</div>
    <div aria-hidden="true" style="position: absolute; left: 70px; top: 80px; width: 22px; height: 22px; border-radius: 11px; background: #0077B6; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(29,53,87,0.3)"></div>
    <div aria-hidden="true" style="position: absolute; left: 190px; top: 130px; width: 22px; height: 22px; border-radius: 11px; background: #F77F00; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(29,53,87,0.3)"></div>
    <div aria-hidden="true" style="position: absolute; left: 260px; top: 60px; width: 22px; height: 22px; border-radius: 11px; background: #8A96A3; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(29,53,87,0.3)"></div>
    <div aria-hidden="true" style="position: absolute; left: 120px; top: 175px; width: 40px; height: 40px; border-radius: 20px; background: rgba(214,40,57,0.22)"></div>
    <div aria-hidden="true" style="position: absolute; left: 129px; top: 184px; width: 22px; height: 22px; border-radius: 11px; background: #D62839; border: 3px solid #FFFFFF; box-sizing: border-box; width: 22px"></div>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.94); font-size: 11.5px; color: #1D3557">
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #0077B6"></span>Abierto</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F77F00"></span>Últimos cupos</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #8A96A3"></span>Lleno</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #D62839"></span>En vivo</span>
    </div>
  </section>

  <section aria-label="Eventos cercanos" style="flex: 1; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Cerca de ti</h2>
    <a href="detalle.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: #1D3557; box-shadow: 0 1px 2px rgba(29,53,87,0.08), 0 4px 12px rgba(29,53,87,0.06)">
      <div aria-hidden="true" style="width: 72px; height: 72px; flex: none; border-radius: 10px; background: #DDE6EE; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A96A3" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="align-self: flex-start; padding: 2px 8px; border-radius: 6px; background: #FFE8CC; color: #7A3E00; font-size: 11.5px; font-weight: 700">Últimos cupos</span>
        <span style="font-size: 15px; font-weight: 700">[Título del evento]</span>
        <span style="font-size: 12.5px; color: #4A5B70">[Categoría] · [Fecha, hora] · [0,8 km]</span>
      </div>
    </a>
    <a href="detalle.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: #1D3557; box-shadow: 0 1px 2px rgba(29,53,87,0.08), 0 4px 12px rgba(29,53,87,0.06)">
      <div aria-hidden="true" style="width: 72px; height: 72px; flex: none; border-radius: 10px; background: #DDE6EE; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A96A3" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="align-self: flex-start; padding: 2px 8px; border-radius: 6px; background: #1D3557; color: #FFFFFF; font-size: 11.5px; font-weight: 700">Plan Relámpago · vence en [2 h]</span>
        <span style="font-size: 15px; font-weight: 700">[Título del plan]</span>
        <span style="font-size: 12.5px; color: #4A5B70">[Categoría] · [Hora] · [1,5 km]</span>
      </div>
    </a>
  </section>

  <nav aria-label="Navegación principal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 64px; background: #FFFFFF; border-top: 1px solid #E3E9EF">
    <a href="explorar.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #0077B6; font-size: 11.5px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Explorar</a>
    <a href="pase.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4A5B70; font-size: 11.5px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v7h-7"></path></svg>Mis pases</a>
    <a href="panel.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4A5B70; font-size: 11.5px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Anfitrión</a>
    <a href="registro.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #4A5B70; font-size: 11.5px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
  </nav>
</div>
</body>
</html>
